name: Refresh profile dashboard
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', 'tests/**', 'profile.json', 'assets/icons/**', 'assets/language-colors.json', '.github/workflows/profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Generate public dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate.py
      - name: Commit changed assets
        shell: bash
        run: |
          git add assets/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile dashboard'
          git push
